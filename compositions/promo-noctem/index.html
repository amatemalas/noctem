<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noctem Studio - Promo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" crossorigin="anonymous">
</head>
<body style="background: #0D1B2A; margin: 0;">
  <div id="noctem-promo" data-composition-id="noctem-promo" data-width="1920" data-height="1080" data-start="0" data-duration="20">
    <style>
      #noctem-promo {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0D1B2A;
        font-family: 'DM Sans', sans-serif;
        overflow: hidden;
        position: relative;
      }

      #noctem-promo * {
        box-sizing: border-box;
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 180px 160px 100px;
        gap: 32px;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
        max-width: 1200px;
      }

      .logo-text {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        font-size: 180px;
        color: #FFFFFF;
        letter-spacing: 0.02em;
        line-height: 1;
        text-shadow: 0 0 60px rgba(252, 163, 17, 0.3);
      }

      .logo-accent {
        color: #FCA311;
      }

      .tagline {
        font-size: 36px;
        font-weight: 500;
        color: #9CA8B8;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .headline {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 72px;
        color: #FFFFFF;
        line-height: 1.2;
        text-shadow: 0 0 40px rgba(252, 163, 17, 0.2);
      }

      .services-grid {
        display: flex;
        gap: 48px;
        justify-content: center;
        margin-top: 20px;
      }

      .service-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .service-icon {
        width: 80px;
        height: 80px;
        border: 2px solid #FCA311;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .service-icon svg {
        width: 36px;
        height: 36px;
        stroke: #FCA311;
        fill: none;
        stroke-width: 1.5;
      }

      .service-label {
        font-size: 20px;
        font-weight: 700;
        color: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-shadow: 0 0 20px rgba(252, 163, 17, 0.2);
      }

      .cta-text {
        font-family: 'Playfair Display', serif;
        font-size: 56px;
        font-weight: 700;
        color: #FFFFFF;
        text-shadow: 0 0 40px rgba(252, 163, 17, 0.3);
      }

      .cta-accent {
        color: #FCA311;
      }

      .subtitle {
        font-size: 24px;
        color: #778DA9;
        letter-spacing: 0.05em;
      }

      .decorative-ring {
        position: absolute;
        border: 1px solid #FCA311;
        opacity: 0.15;
        border-radius: 50%;
      }

      .decorative-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(252,163,17,0.15) 0%, transparent 70%);
        filter: blur(60px);
      }

      .camera-shutter {
        position: absolute;
        width: 120px;
        height: 120px;
        opacity: 0.1;
      }

      .camera-shutter svg {
        width: 100%;
        height: 100%;
        stroke: #FCA311;
        fill: none;
      }

      .line-accent {
        width: 80px;
        height: 4px;
        background: #FCA311;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // === SCENE 1: Logo Reveal (0-5s) ===
      tl.set(".scene-1", { opacity: 0 }, 0);
      tl.to(".scene-1", { opacity: 1, duration: 0.1 }, 0);

      // Logo entrance
      tl.from(".logo-text", {
        y: 100,
        opacity: 0,
        duration: 1.2,
        ease: "power4.out"
      }, 0.3);

      // Decorative elements
      tl.from(".decorative-glow-1", {
        scale: 0.5,
        opacity: 0,
        duration: 1.5,
        ease: "power2.out"
      }, 0.5);

      tl.from(".decorative-ring-1", {
        scale: 0.8,
        opacity: 0,
        duration: 1,
        ease: "power2.out"
      }, 0.8);

      // Transition out scene 1
      tl.to(".scene-1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);

      // === SCENE 2: Tagline (5-10s) ===
      tl.set(".scene-2", { opacity: 0 }, 4.5);
      tl.to(".scene-2", { opacity: 1, duration: 0.1 }, 4.5);

      // Tagline text
      tl.from(".tagline", {
        y: 60,
        opacity: 0,
        duration: 1,
        ease: "power3.out"
      }, 5);

      // Headline
      tl.from(".headline-s2", {
        y: 40,
        opacity: 0,
        duration: 0.8,
        ease: "power3.out"
      }, 5.5);

      // Decorative line
      tl.from(".line-accent", {
        scaleX: 0,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out"
      }, 6.2);

      // Camera shutter decorative
      tl.from(".camera-shutter-1", {
        rotation: -45,
        opacity: 0,
        duration: 0.8,
        ease: "power2.out"
      }, 5.2);

      // Transition out scene 2
      tl.to(".scene-2", { opacity: 0, duration: 0.5, ease: "power2.in" }, 9.5);

      // === SCENE 3: Services (10-16s) ===
      tl.set(".scene-3", { opacity: 0 }, 9.5);
      tl.to(".scene-3", { opacity: 1, duration: 0.1 }, 9.5);

      // Headline
      tl.from(".headline-s3", {
        y: 50,
        opacity: 0,
        duration: 0.9,
        ease: "power3.out"
      }, 10);

      // Services stagger
      tl.from(".service-item", {
        y: 40,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out"
      }, 10.8);

      // Decorative glow
      tl.from(".decorative-glow-3", {
        scale: 0.6,
        opacity: 0,
        duration: 1.2,
        ease: "power2.out"
      }, 10.2);

      // Transition out scene 3
      tl.to(".scene-3", { opacity: 0, duration: 0.5, ease: "power2.in" }, 15.5);

      // === SCENE 4: CTA (16-20s) ===
      tl.set(".scene-4", { opacity: 0 }, 15.5);
      tl.to(".scene-4", { opacity: 1, duration: 0.1 }, 15.5);

      // CTA text
      tl.from(".cta-text", {
        y: 40,
        opacity: 0,
        duration: 0.8,
        ease: "power3.out"
      }, 16);

      tl.from(".subtitle-s4", {
        y: 20,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out"
      }, 16.8);

      // Final decorative ring
      tl.from(".decorative-ring-final", {
        scale: 0.9,
        opacity: 0,
        duration: 1,
        ease: "power2.out"
      }, 16.5);

      // Fade to black at end
      tl.to("body", { backgroundColor: "#000000", duration: 1 }, 19);

      window.__timelines["noctem-promo"] = tl;
    </script>

    <!-- Scene 1: Logo -->
    <div class="scene scene-1">
      <div class="decorative-glow decorative-glow-1" style="top: 20%; left: 50%; transform: translateX(-50%);"></div>
      <div class="decorative-ring decorative-ring-1" style="width: 400px; height: 400px; top: 30%; left: 50%; transform: translateX(-50%);"></div>
      <div class="scene-content">
        <h1 class="logo-text">
          NOCTEM<span class="logo-accent">.</span>
        </h1>
      </div>
    </div>

    <!-- Scene 2: Tagline -->
    <div class="scene scene-2">
      <div class="camera-shutter camera-shutter-1" style="top: 15%; right: 15%;">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40"/>
          <line x1="50" y1="10" x2="50" y2="30"/>
          <line x1="50" y1="70" x2="50" y2="90"/>
          <line x1="10" y1="50" x2="30" y2="50"/>
          <line x1="70" y1="50" x2="90" y2="50"/>
        </svg>
      </div>
      <div class="decorative-glow decorative-glow-1" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
      <div class="scene-content">
        <p class="tagline">Estudio de Fotografía & Audiovisuales</p>
        <h2 class="headline headline-s2">Capturando momentos,<br>creando historias</h2>
        <div class="line-accent"></div>
      </div>
    </div>

    <!-- Scene 3: Services -->
    <div class="scene scene-3">
      <div class="decorative-glow decorative-glow-3" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
      <div class="scene-content">
        <h2 class="headline headline-s3">Lo que hacemos</h2>
        <div class="services-grid">
          <div class="service-item">
            <div class="service-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <span class="service-label">Fotografía</span>
          </div>
          <div class="service-item">
            <div class="service-icon">
              <svg viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <polygon points="10,8 16,12 10,16"/>
              </svg>
            </div>
            <span class="service-label">Vídeo</span>
          </div>
          <div class="service-item">
            <div class="service-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <span class="service-label">Postproducción</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Scene 4: CTA -->
    <div class="scene scene-4">
      <div class="decorative-ring decorative-ring-final" style="width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
      <div class="scene-content">
        <p class="cta-text">Hagamos algo <span class="cta-accent">increíble</span></p>
        <p class="subtitle subtitle-s4">cont@noctem.es</p>
      </div>
    </div>

  </div>
</body>
</html>
